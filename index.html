<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma - Ingreso</title>
</head>

<body>

    <header>
        <img src="./Imagenes/logo.jpg" 
            alt="Luma - Viajes que empiezan antes de partir"
            width="300">

        <p>Viajes que comienzan antes de partir.</p>
    </header>

    <main>

        <section>
            <h1>Iniciar sesión</h1>

            <form method="post">

                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="username" required>
                <br>
                <br>
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="password" required>
                <br>
                <br>
                <button type="submit">Ingresar/ aca va a ir el href que lleve a la otra pagina</button> 
            </form>
        </section>
        <section>
            <h2>¿Primera vez en Luma?</h2>
            <p>
                Todavía no existe un usuario con perfil Administrador.
                Para comenzar, es necesario crear el primer administrador.
            </p>
            <a href="crearAdmin.html">
                Crear primer administrador
            </a>
        </section>

    </main>

    <footer>

    </footer>

</body>
</html>
