<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador</title>
</head>
<body>
    <header>
            <img src="./Imagenes/logo.jpg" 
            alt="Luma - Viajes que empiezan antes de partir"
            width="300">

        <p>Viajes que comienzan antes de partir.</p>
    </header>
    <h1> Crear primer administrador</h1>
    <br>
    <main>
    <p>Completá tus datos para empezar a usar Luma.</p>
    <section>
        <form action="index.html" method="post"> </form>
        <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="name" required>
                <br>
        <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="surname" required>
                <br>
        <label for="mail">Email:</label>
                <input type="email" id="mail" name="mail" required >
                <br>
        <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="username" required>
                <br>
        <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="password" required>
                <br>
        <label for="contrasena">Repetir contraseña:</label>
                <input type="password" id="contrasena1" name="password2" required>
                <br>
                <button type="submit">Enviar</button>
    </section>
    </main>
    <div>
        <a href="index.html">Volver al inicio</a>
    </div>
</body>
</html>
